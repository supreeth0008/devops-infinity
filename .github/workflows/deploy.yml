name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-infinity
  APP_VERSION: ${{ github.run_number }}

jobs:
  build-and-deploy:
    name: Build, Scan, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.APP_VERSION }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$APP_VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 499290259342.dkr.ecr.ap-south-1.amazonaws.com
            sudo docker pull 499290259342.dkr.ecr.ap-south-1.amazonaws.com/devops-infinity:latest
            sudo docker stop devops-infinity 2>/dev/null || true
            sudo docker rm devops-infinity 2>/dev/null || true
            sudo docker run -d --name devops-infinity --restart always -p 5000:5000 -e APP_VERSION=${{ github.run_number }} 499290259342.dkr.ecr.ap-south-1.amazonaws.com/devops-infinity:latest
            sudo docker ps

      - name: Verify deployment
        run: |
          sleep 15
          curl -f http://${{ secrets.EC2_HOST }}:5000/health
