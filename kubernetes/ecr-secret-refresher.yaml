apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  namespace: devops-infinity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
  namespace: devops-infinity
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
  namespace: devops-infinity
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: devops-infinity
roleRef:
  kind: Role
  name: ecr-secret-refresher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresher
  namespace: devops-infinity
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: Never
          containers:
            - name: ecr-secret-refresher
              image: amazon/aws-cli:latest
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: aws_access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: aws_secret_access_key
                - name: AWS_DEFAULT_REGION
                  value: ap-south-1
              command:
                - /bin/sh
                - -c
                - |
                  TOKEN=$(aws ecr get-login-password --region ap-south-1)
                  kubectl delete secret ecr-secret -n devops-infinity 2>/dev/null || true
                  kubectl create secret docker-registry ecr-secret                     --namespace devops-infinity                     --docker-server=499290259342.dkr.ecr.ap-south-1.amazonaws.com                     --docker-username=AWS                     --docker-password=$TOKEN
