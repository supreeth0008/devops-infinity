<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Infinity Pipeline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      color: #58a6ff;
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    p {
      color: #8b949e;
      margin: 8px 0;
      font-size: 0.95rem;
    }
    .badge {
      display: inline-block;
      background: #1a4731;
      color: #3fb950;
      border: 1px solid #3fb950;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.8rem;
      margin: 5px;
    }
    .info {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      font-size: 0.85rem;
      text-align: left;
    }
    .info p {
      padding: 5px 0;
      border-bottom: 1px solid #21262d;
    }
    .info p:last-child {
      border-bottom: none;
    }
    .info span {
      color: #58a6ff;
      float: right;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>DevOps Infinity Pipeline</h1>
    <p>Deployed via automated CI/CD pipeline</p>
    <br/>
    <span class="badge">Docker</span>
    <span class="badge">GitHub Actions</span>
    <span class="badge">AWS EC2</span>
    <span class="badge">Terraform</span>
    <div class="info">
      <p>Hostname <span>{{ hostname }}</span></p>
      <p>Version <span>{{ version }}</span></p>
      <p>Cloud <span>AWS EC2 - ap-south-1</span></p>
      <p>Infrastructure <span>Terraform</span></p>
      <p>CI/CD <span>GitHub Actions</span></p>
    </div>
  </div>
</body>
</html>
